name: Build Mypet Plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        shell: bash
        run: gradle build --console=plain 2>&1 | tee build.log
      - name: Mostrar errores
        if: failure()
        run: grep -E "error:|What went wrong|Could not|not found|cannot find" -A4 build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: Mypet
          path: build/libs/*.jar
