name: Build Mypet Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Listar archivos generados
        run: |
          echo "=== Contenido de build ==="
          find build -name "*.jar" -type f || echo "No hay JAR"
          echo "=== build/libs ==="
          ls -la build/libs/ || echo "no existe build/libs"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mypet-Plugin
          path: '**/build/libs/*.jar'
          if-no-files-found: warn
