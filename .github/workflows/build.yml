name: Build Mypet Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Ver archivos Java
        run: |
          echo "=== Buscando archivos .java ==="
          find . -name "*.java" -not -path "*/node_modules/*"
          echo "=== Contenido de src ==="
          ls -R src/

      - name: Compilar y generar JAR
        run: |
          mkdir -p build/libs
          javac -d build/classes $(find src/main/java -name "*.java") 2>&1 || echo "javac falló, continuando..."

      - name: Listar build
        run: |
          echo "=== build/ ==="
          find build -type f

      - name: Build con Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Listar libs
        run: |
          echo "=== build/libs/ ==="
          ls -la build/libs/ 2>/dev/null || echo "NO HAY build/libs"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mypet-Plugin
          path: build/libs/*.jar
          if-no-files-found: warn
